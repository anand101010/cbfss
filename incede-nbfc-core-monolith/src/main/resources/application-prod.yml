# Production Profile Configuration
# This profile is used for production deployment

spring:
  profiles:
    active: prod
  
  # PostgreSQL Database Configuration for Production
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.199.232.3:5432/testincededb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:incedetestuser}
    password: ${SPRING_DATASOURCE_PASSWORD:incedetestuser}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration for Production
  jpa:
    hibernate:
      ddl-auto: validate # Never auto-create tables in production
    show-sql: false # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration for Production
logging:
  level:
    com.incede.nbfc: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/incede-nbfc-core-monolith.log
    max-size: 100MB
    max-history: 30

# OpenAPI Configuration for Production (Disabled for Security)
springdoc:
  api-docs:
    path: /api-docs
    enabled: false # Disabled for security
  swagger-ui:
    path: /swagger-ui.html
    enabled: false # Disabled for security
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.incede.nbfc.core.monolith.controller

# Actuator Configuration for Production (Minimal exposure)
management:
  endpoints:
    web:
      exposure:
        include: health # Only health endpoint exposed
  endpoint:
    health:
      show-details: never # Don't show detailed health info
  metrics:
    export:
      prometheus:
        enabled: false # Disable metrics export

# Security Configuration for Production
security:
  # Basic security configuration - will be enhanced later

# Application Configuration for Production
app:
  name: Incede NBFC Core Monolith
  version: 1.0.0
  description: Integrated NBFC Core Services - Production Environment
  environment: production
  database:
    schemas:
      - customer_schema
      - master_data
      - product_schema
      - loan_schema
      - payment_schema
      - document_schema
      - notification_schema
      - audit_schema
      - reporting_schema
      - integration_schema
      - security_schema

# Performance Configuration for Production
server:
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    max-connections: 8192
    accept-count: 100
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024 