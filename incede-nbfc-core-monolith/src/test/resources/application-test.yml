# Test-specific configuration for Incede NBFC Core Monolith Service
spring:
  profiles:
    active: test
  
  # Database configuration for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA/Hibernate configuration for testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: false
    database-platform: org.hibernate.dialect.H2Dialect
  
  # H2 console for testing (if needed)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Security configuration for testing - disable security for tests
  security:
    enabled: false
    user:
      name: testuser
      password: testpass
      roles: USER,ADMIN
  
  # Disable security auto-configuration for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging configuration for testing
logging:
  level:
    com.incede.nbfc: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Server configuration for testing
server:
  port: 0  # Random port for testing
  servlet:
    context-path: /

# Test-specific properties
test:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://127.0.0.1:3000
      - http://*.incede.com
      - https://*.incede.com
  security:
    csrf:
      enabled: false
    headers:
      enabled: false

# Disable actuator for tests to avoid context loading issues
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never 