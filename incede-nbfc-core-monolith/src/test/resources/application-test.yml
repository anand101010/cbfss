# Test-specific configuration for Incede NBFC Core Monolith Service
# DO NOT set spring.profiles.active here

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    enabled: false
    user:
      name: testuser
      password: testpass
      roles: USER,ADMIN

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging:
  level:
    com.incede.nbfc: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 0
  servlet:
    context-path: /

test:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://127.0.0.1:3000
      - http://*.incede.com
      - https://*.incede.com
  security:
    csrf:
      enabled: false
    headers:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
