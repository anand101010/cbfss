# Collateral Management Service Configuration
spring:
  application:
    name: incede-nbfc-collateral-management-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres123
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: collateral_management_schema
        format_sql: true
        show_sql: false
  security:
    enabled: true
  autoconfigure:
    exclude: []

server:
  port: 8083
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.incede.nbfc: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Service specific configuration
app:
  service:
    name: Collateral Management Service
    version: 1.0.0
    description: Collateral management and valuation
  database:
    schema: collateral_management_schema
  security:
    jwt:
      secret: ${JWT_SECRET:collateral-management-secret-key}
      expiration: 86400000 # 24 hours 